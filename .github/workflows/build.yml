name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  # SHA-256 of the permanent signing certificate (public value, not a secret). Every APK must carry exactly this one.
  EXPECTED_CERT_SHA256: a5abeb52778750be8a9925477e72da5e0df7b3bb59a362a6cb39d161a3fe42b7
  EXPECTED_APP_ID: com.effects.motion

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Effects
    timeout-minutes: 240
    env:
      ANDROID_HOME: ${{ github.workspace }}/../android-sdk
      ANDROID_NDK: ${{ github.workspace }}/../android-sdk/ndk/30.0.16248370
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Effects.zip
        working-directory: .
        run: unzip -oqq Effects.zip

      - name: Unpack overlay.zip
        working-directory: .
        run: |
          if [ -f overlay.zip ]; then unzip -oqq overlay.zip; fi

      - name: Set the app version from the run number
        working-directory: .
        run: |
          printf 'versionName=1.0.%s\nversionCode=%s\n' "${{ github.run_number }}" "${{ github.run_number }}" > Effects/version.properties

      - name: Overlay patched source files
        working-directory: .
        run: |
          if [ -d overlay ]; then cp -r overlay/. .; fi
          if [ -f overlay_ae.zip ]; then unzip -oqq overlay_ae.zip -d overlay_ae && cp -r overlay_ae/overlay/. . 2>/dev/null || cp -r overlay_ae/. .; fi

      - name: Unpack effect libraries (pack.zip, effects.zip, ae.zip, aligthmotion.zip, glsl.zip, emx.zip, whichever are in the repo)
        working-directory: .
        run: |
          for z in pack.zip effects.zip ae.zip aligthmotion.zip glsl.zip emx.zip; do
            if [ -f "$z" ]; then unzip -oqq "$z"; fi
          done
          pip install --quiet pillow

      - name: Add effects (effects/ and pack/ json = Performance, glsl/ = Balance, emx/ = Heavy effects, aligthmotion/ = Alight Motion)
        working-directory: .
        run: python3 tools/fxconvert.py

      - name: Bundle the After Effects library (assets/ae)
        working-directory: .
        run: |
          if [ -d ae ]; then
            mkdir -p Effects/shared/assets/ae
            cp ae/*.xml ae/*.json Effects/shared/assets/ae/ 2>/dev/null || true
            python3 - <<'PY'
          import os, json
          d = 'Effects/shared/assets/ae'
          fs = sorted(f for f in os.listdir(d) if f.endswith(('.xml', '.json')) and f != 'index.json')
          json.dump(fs, open(d + '/index.json', 'w'))
          print(len(fs), 'AE effects bundled')
          PY
          fi

      - name: Add thumbnails from the repo's thumbs folder
        working-directory: .
        run: |
          if [ -d thumbs ]; then
            mkdir -p Effects/shared/assets/effects/thumb
            cp thumbs/* Effects/shared/assets/effects/thumb/
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang lld python3 git curl unzip

      - name: Install the Android SDK, NDK and CMake
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          echo '2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  /tmp/cmdline-tools.zip' | sha256sum -c -
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # whisper.cpp and ncnn are not part of the source zip; fetch the pinned versions.
      - name: Fetch whisper.cpp and ncnn
        run: |
          [ -f third_party/whisper.cpp/CMakeLists.txt ] || { rm -rf third_party/whisper.cpp; git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp third_party/whisper.cpp; }
          [ -f third_party/ncnn/CMakeLists.txt ] || { rm -rf third_party/ncnn; git clone --depth 1 --branch 20261020 --recurse-submodules --shallow-submodules https://github.com/Tencent/ncnn third_party/ncnn; }

      - name: Restore Skia
        id: skia
        uses: actions/cache@v4
        with:
          path: Effects/third_party/skia
          key: skia-arm64-${{ hashFiles('Effects/tools/build_skia.sh', 'Effects/tools/skia-args.gn', 'Effects/tools/skia-patches/**') }}

      - name: Build Skia (first run only, about 1 to 2 hours)
        if: steps.skia.outputs.cache-hit != 'true'
        run: |
          tools/build_skia.sh
          rm -rf third_party/skia/out/android-arm64/obj

      - name: Apply the permanent signing config to the build file
        working-directory: .
        run: |
          rm -f Effects/app/ci-debug.keystore Effects/app/debug.keystore debug.keystore
          python3 tools/apply_signing.py Effects/app/build.gradle.kts
          grep -q PERMANENT_SIGNING Effects/app/build.gradle.kts
          ! grep -q 'ci-debug' Effects/app/build.gradle.kts

      - name: Load the permanent signing key and check its fingerprint
        working-directory: .
        env:
          KS_B64: ${{ secrets.EFFECTS_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.EFFECTS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EFFECTS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.EFFECTS_KEY_PASSWORD }}
        run: |
          for v in KS_B64 KS_PASS KEY_ALIAS; do
            [ -n "${!v}" ] || { echo "::error::GitHub secret for $v is missing (EFFECTS_KEYSTORE_BASE64 / EFFECTS_KEYSTORE_PASSWORD / EFFECTS_KEY_ALIAS). Refusing to build with any other key."; exit 1; }
          done
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/effects.jks"
          GOT=$(keytool -list -v -keystore "$RUNNER_TEMP/effects.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')
          echo "keystore certificate SHA-256: $GOT"
          echo "expected                    : $EXPECTED_CERT_SHA256"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::The keystore in the secret is NOT the permanent key. Build stopped."; exit 1; }
          {
            echo "EFFECTS_KEYSTORE_PATH=$RUNNER_TEMP/effects.jks"
            echo "EFFECTS_KEYSTORE_PASSWORD=$KS_PASS"
            echo "EFFECTS_KEY_ALIAS=$KEY_ALIAS"
            echo "EFFECTS_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
          } >> "$GITHUB_ENV"

      - name: Build the FOSS release APK (R8 enabled by release build type)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-daemon --stacktrace

      - name: Verify the release APK (certificate, app id, version). Fails the build on any mismatch
        run: |
          APK=$(find app/build/outputs/apk/foss/release -maxdepth 1 -name '*.apk' -print -quit)
          [ -n "$APK" ] || { echo "::error::FOSS release APK was not produced"; exit 1; }
          BT="$ANDROID_HOME/build-tools/37.0.0"
          CERTS=$("$BT/apksigner" verify --verbose --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -q 'Number of signers: 1' || { echo "::error::APK must have exactly one signer"; exit 1; }
          GOT=$(echo "$CERTS" | sed -n 's/^.*[Ss]igner[^:]*: certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')
          BADGE=$("$BT/aapt2" dump badging "$APK" | head -1)
          APPID=$(echo "$BADGE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VCODE=$(echo "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          {
            echo "### Signing check for $(basename "$APK")"
            echo '```'
            echo "signer SHA-256 : $GOT"
            echo "expected       : $EXPECTED_CERT_SHA256"
            echo "applicationId  : $APPID"
            echo "versionCode    : $VCODE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$GOT" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::APK certificate differs from the permanent fingerprint"; exit 1; }
          [ "$APPID" = "$EXPECTED_APP_ID" ] || { echo "::error::applicationId is $APPID, expected $EXPECTED_APP_ID"; exit 1; }
          [ "$VCODE" = "${{ github.run_number }}" ] || { echo "::error::versionCode $VCODE != run number"; exit 1; }

      - name: Upload FOSS release APK and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: Effects-foss-release-apk
          path: |
            Effects/app/build/outputs/apk/foss/release/*.apk
            Effects/app/build/outputs/mapping/fossRelease/mapping.txt

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            Effects/app/build/reports
            Effects/app/.cxx/**/*.txt
            Effects/app/.cxx/**/*.log


            
