name: Generate keystore
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - run: |
          keytool -genkeypair -v -keystore effects.jks -alias effects \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass effects123 -keypass effects123 \
            -dname "CN=Effects, O=Effects, C=US"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: effects.jks
