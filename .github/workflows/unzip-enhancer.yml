name: Unzip enhancer pack
on:
  push:
    paths: ['enhancer_tool_pack.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o enhancer_tool_pack.zip
          rm enhancer_tool_pack.zip
      - name: Commit
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Unpack enhancer tool pack" || exit 0
          git push
